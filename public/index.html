<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖平台账号管理器</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="default-icon.png" type="image/png">
</head>
<body>
  <div class="container">
    <header>
      <h1>外卖平台账号管理器</h1>
      <div class="tabs">
        <button class="tab-btn active" data-tab="accounts">账号列表</button>
        <button class="tab-btn" data-tab="add-account">添加账号</button>
      </div>
    </header>
    
    <main>
      <!-- 账号列表 -->
      <div id="accounts" class="tab-pane active">
        <div class="section-header">
          <h2>账号列表</h2>
          <div class="section-actions">
            <div class="search-container">
              <input type="text" id="search-input" placeholder="搜索用户名或昵称...">
              <select id="filter-platform">
                <option value="">全部平台</option>
              </select>
              <select id="filter-status">
                <option value="">全部状态</option>
                <option value="online">在线</option>
                <option value="offline">离线</option>
                <option value="expired">已过期</option>
                <option value="unknown">未知</option>
              </select>
            </div>
            <button id="refresh-btn" class="btn btn-primary">刷新状态</button>
          </div>
        </div>
        
        <div class="account-stats">
          <div class="stat-card">
            <span class="stat-value" id="total-accounts">0</span>
            <span class="stat-label">总账号</span>
          </div>
          <div class="stat-card online">
            <span class="stat-value" id="online-accounts">0</span>
            <span class="stat-label">在线</span>
          </div>
          <div class="stat-card offline">
            <span class="stat-value" id="offline-accounts">0</span>
            <span class="stat-label">离线</span>
          </div>
          <div class="stat-card expired">
            <span class="stat-value" id="expired-accounts">0</span>
            <span class="stat-label">已过期</span>
          </div>
        </div>
        
        <div class="account-table-container">
          <table class="account-table">
            <thead>
              <tr>
                <th>平台</th>
                <th>用户名</th>
                <th>昵称</th>
                <th>状态</th>
                <th>最后登录</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="account-list">
              <tr>
                <td colspan="6" class="loading">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <!-- 添加账号表单 -->
      <div id="add-account" class="tab-pane">
        <h2>添加账号</h2>
        <form id="add-account-form" class="form">
          <div class="form-group">
            <label for="platform">平台</label>
            <select id="platform" name="platform" required>
              <option value="">--选择平台--</option>
            </select>
          </div>
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="nickname">昵称（可选）</label>
            <input type="text" id="nickname" name="nickname">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>
      </div>
    </main>
    
    <!-- 编辑账号模态框 -->
    <div id="edit-account-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>编辑账号</h2>
          <button class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <form id="edit-account-form" class="form">
            <div class="form-group">
              <label for="edit-platform">平台</label>
              <select id="edit-platform" name="platform" required>
                <option value="">--选择平台--</option>
              </select>
            </div>
            <div class="form-group">
              <label for="edit-username">用户名</label>
              <input type="text" id="edit-username" name="username" required>
            </div>
            <div class="form-group">
              <label for="edit-password">密码（留空保持不变）</label>
              <input type="password" id="edit-password" name="password">
            </div>
            <div class="form-group">
              <label for="edit-nickname">昵称（可选）</label>
              <input type="text" id="edit-nickname" name="nickname">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="save-edit-btn" class="btn btn-primary">保存</button>
          <button class="btn btn-secondary close-btn">取消</button>
        </div>
      </div>
    </div>
    
    <!-- 确认删除模态框 -->
    <div id="confirm-delete-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>确认删除</h2>
          <button class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p>确定要删除这个账号吗？此操作不可撤销。</p>
        </div>
        <div class="modal-footer">
          <button id="confirm-delete-btn" class="btn btn-danger">删除</button>
          <button class="btn btn-secondary close-btn">取消</button>
        </div>
      </div>
    </div>
    
    <!-- 通知提示 -->
    <div id="notification" class="notification">
      <span id="notification-message"></span>
      <button class="close-notification">&times;</button>
    </div>
    
    <footer>
      <p>&copy; 2024 外卖平台账号管理器</p>
    </footer>
  </div>
  
  <script src="js/renderer.js"></script>
</body>
</html>
