<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖平台账号管理器</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="default-icon.png" type="image/png">
</head>
<body>
  <div class="container">
    <header>
      <h1>外卖平台账号管理器</h1>
      <div class="tabs">
        <button class="tab-btn active" data-tab="accounts">账号列表</button>
        <button class="tab-btn" data-tab="add-account">添加账号</button>
      </div>
    </header>
    
    <main>
      <!-- 账号列表 -->
      <div id="accounts" class="tab-pane active">
        <div class="section-header">
          <h2>账号列表</h2>
          <button id="refresh-btn" class="btn btn-primary">刷新状态</button>
        </div>
        <div id="account-list" class="account-list">
          <div class="loading">加载中...</div>
        </div>
      </div>
      
      <!-- 添加账号表单 -->
      <div id="add-account" class="tab-pane">
        <h2>添加账号</h2>
        <form id="add-account-form" class="form">
          <div class="form-group">
            <label for="platform">平台</label>
            <select id="platform" name="platform" required>
              <option value="">--选择平台--</option>
            </select>
          </div>
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="nickname">昵称（可选）</label>
            <input type="text" id="nickname" name="nickname">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>
      </div>
    </main>
    
    <!-- 编辑账号模态框 -->
    <div id="edit-account-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>编辑账号</h2>
          <button class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <form id="edit-account-form" class="form">
            <div class="form-group">
              <label for="edit-platform">平台</label>
              <select id="edit-platform" name="platform" required>
                <option value="">--选择平台--</option>
              </select>
            </div>
            <div class="form-group">
              <label for="edit-username">用户名</label>
              <input type="text" id="edit-username" name="username" required>
            </div>
            <div class="form-group">
              <label for="edit-password">密码（留空保持不变）</label>
              <input type="password" id="edit-password" name="password">
            </div>
            <div class="form-group">
              <label for="edit-nickname">昵称（可选）</label>
              <input type="text" id="edit-nickname" name="nickname">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="save-edit-btn" class="btn btn-primary">保存</button>
          <button class="btn btn-secondary close-btn">取消</button>
        </div>
      </div>
    </div>
    
    <footer>
      <p>&copy; 2023 外卖平台账号管理器</p>
    </footer>
  </div>
  
  <script src="js/renderer.js"></script>
</body>
</html>
