name: 构建应用

on:
  push:
    branches: [ main, master, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'

      # 配置Electron镜像
      - name: 配置Electron镜像
        run: |
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV
        shell: bash

      # 缓存Electron
      - name: 缓存Electron
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.electron
            ${{ runner.temp }}/.electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: 安装依赖
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          
      - name: 构建应用
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false
          
      - name: 上传 Windows 安装包
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: |
            dist/*.exe
            
      - name: 上传 Windows 便携版
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v3
        with:
          name: windows-portable
          path: dist/win-unpacked
          
      - name: 上传 macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v3
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            
  release:
    name: 创建发布版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 获取版本号
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: 下载构建产物
        uses: actions/download-artifact@v3
        with:
          path: dist
          
      - name: 显示结构
        run: ls -R
        working-directory: dist
        
      - name: 创建版本发布
        uses: softprops/action-gh-release@v1
        with:
          name: 外卖账号管理系统 v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
          body_path: releases/v${{ steps.get_version.outputs.VERSION }}-release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 