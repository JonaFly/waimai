name: 构建Windows应用

on:
  push:
    branches: [ main, master, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: 构建Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 显示环境信息
        run: |
          node --version
          npm --version
          echo "OS: $env:OS"
          echo "工作目录: $env:GITHUB_WORKSPACE"
          dir
          
      - name: 确保图标目录存在
        run: |
          if (-not (Test-Path "public\icons")) {
            New-Item -Path "public\icons" -ItemType Directory -Force
          }
          if (-not (Test-Path "public\icons\icon.ico")) {
            Copy-Item "public\icon.png" -Destination "public\icons\icon.png" -Force
            echo "创建空白图标文件"
            New-Item -Path "public\icons\icon.ico" -ItemType File -Force
          }
          dir public\icons

      - name: 安装依赖
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/
          npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
          npm ci
        
      # 使用更简单的构建方式
      - name: 构建Windows应用 (简化方式)
        run: |
          # 创建简单的打包脚本
          $packScript = @"
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const packageJson = require('./package.json');
          
          // 确保目录存在
          if (!fs.existsSync('dist')) {
            fs.mkdirSync('dist', { recursive: true });
          }
          
          console.log('正在打包基本应用...');
          execSync('npx electron-packager . "外卖账号管理系统" --platform=win32 --arch=x64 --out=dist --icon=public/icons/icon.ico --overwrite', { stdio: 'inherit' });
          
          console.log('打包完成!');
          console.log('输出目录:');
          const distFiles = fs.readdirSync('dist');
          console.log(distFiles);
          "@
          
          # 将脚本写入文件
          Set-Content -Path "simple-pack.js" -Value $packScript
          
          # 安装electron-packager
          npm install --no-save electron-packager
          
          # 运行打包脚本
          node simple-pack.js
          
      - name: 检查构建结果
        run: |
          echo "检查dist目录"
          if (Test-Path dist) {
            dir dist -Recurse | Select-Object FullName
          } else {
            echo "dist目录不存在"
          }
          
      - name: 创建ZIP压缩包
        run: |
          $appDir = Get-ChildItem -Path "dist" -Directory | Select-Object -First 1
          if ($appDir) {
            echo "压缩应用: $($appDir.FullName)"
            Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath "dist\外卖账号管理系统-win-x64.zip" -Force
            echo "压缩完成"
          } else {
            echo "未找到应用目录"
            exit 1
          }
          
      - name: 上传 Windows 应用
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/*.zip
          if-no-files-found: warn
            
  release:
    name: 创建发布版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 获取版本号
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          
      - name: 显示结构
        run: ls -R
        working-directory: dist
        
      - name: 创建版本发布
        uses: softprops/action-gh-release@v1
        with:
          name: 外卖账号管理系统 v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 