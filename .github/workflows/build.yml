name: 构建Windows应用

on:
  push:
    branches: [ main, master, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: 构建Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 显示环境信息
        run: |
          node --version
          npm --version
          echo "OS: $env:OS"
          echo "工作目录: $env:GITHUB_WORKSPACE"
          dir
          
      - name: 确保图标目录存在
        run: |
          if (-not (Test-Path "public\icons")) {
            New-Item -Path "public\icons" -ItemType Directory -Force
          }
          if (-not (Test-Path "public\icons\icon.ico")) {
            Copy-Item "public\icon.png" -Destination "public\icons\icon.png" -Force
            echo "创建空白图标文件"
            New-Item -Path "public\icons\icon.ico" -ItemType File -Force
          }
          dir public\icons

      - name: 安装依赖
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/
          npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
          npm ci
        
      # 使用简化方式构建Windows应用
      - name: 创建简化构建脚本
        run: |
          $simpleScript = @'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          
          console.log('Starting Windows build...');
          
          // Create portable build
          try {
            console.log('Creating portable executable...');
            
            // Ensure dist directory exists
            if (!fs.existsSync('dist')) {
              fs.mkdirSync('dist', { recursive: true });
            }
            
            // Use electron-packager for simplicity
            execSync('npx electron-packager . WaimaiAccountManager --platform=win32 --arch=x64 --out=dist --overwrite --executable-name=WaimaiAccountManager', { 
              stdio: 'inherit',
              env: {
                ...process.env,
                ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
              }
            });
            
            console.log('Build completed successfully!');
            
            // List output files
            if (fs.existsSync('dist')) {
              console.log('Output directory contents:');
              const files = fs.readdirSync('dist');
              console.log(files);
              
              // Find the app directory
              const appDir = files.find(f => fs.statSync(path.join('dist', f)).isDirectory());
              if (appDir) {
                console.log(`App directory: ${appDir}`);
                
                // Create a simple batch file to launch the app
                const batchContent = `@echo off\r\nstart "" "%~dp0${appDir}\\WaimaiAccountManager.exe"\r\n`;
                fs.writeFileSync('dist/启动外卖账号管理系统.bat', batchContent);
                
                // Create a simple readme
                fs.writeFileSync('dist/README.txt', 'Double-click the batch file to start the application.\r\n');
              }
            }
          } catch (error) {
            console.error('Build failed:', error);
            process.exit(1);
          }
          '@
          
          # 将脚本写入文件
          Set-Content -Path "simple-build.js" -Value $simpleScript -Encoding UTF8
      
      - name: 安装electron-packager
        run: npm install --no-save electron-packager
      
      - name: 运行简化构建脚本
        run: node simple-build.js
      
      - name: 检查构建结果
        run: |
          echo "检查dist目录"
          if (Test-Path dist) {
            dir dist -Recurse | Select-Object FullName
          } else {
            echo "dist目录不存在"
          }
      
      - name: 创建ZIP压缩包
        run: |
          $appDir = Get-ChildItem -Path "dist" -Directory | Select-Object -First 1
          if ($appDir) {
            echo "Creating ZIP archive from: $($appDir.FullName)"
            Compress-Archive -Path "dist\*" -DestinationPath "dist\WaimaiAccountManager-win-x64.zip" -Force
            echo "ZIP archive created"
          } else {
            echo "No application directory found"
            exit 1
          }
          
      - name: 上传Windows应用
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/*.zip
            dist/*.bat
          if-no-files-found: warn
            
  release:
    name: 创建发布版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 获取版本号
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          
      - name: 显示结构
        run: ls -R
        working-directory: dist
        
      - name: 创建版本发布
        uses: softprops/action-gh-release@v1
        with:
          name: 外卖账号管理系统 v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.zip
            dist/**/*.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 