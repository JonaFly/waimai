name: 构建Windows应用

on:
  push:
    branches: [ main, master, feature/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: 构建Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 显示环境信息
        run: |
          node --version
          npm --version
          echo "OS: $env:OS"
          echo "工作目录: $env:GITHUB_WORKSPACE"
          dir
          
      - name: 确保图标目录存在
        run: |
          if (-not (Test-Path "public\icons")) {
            New-Item -Path "public\icons" -ItemType Directory -Force
          }
          if (-not (Test-Path "public\icons\icon.ico")) {
            Copy-Item "public\icon.png" -Destination "public\icons\icon.png" -Force
            echo "创建空白图标文件"
            New-Item -Path "public\icons\icon.ico" -ItemType File -Force
          }
          dir public\icons

      - name: 安装依赖
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/
          npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
          npm ci
        
      # 使用electron-forge生成独立exe
      - name: 构建Windows应用 (生成独立EXE)
        run: |
          # 创建forge配置
          $forgeConfig = @"
          module.exports = {
            packagerConfig: {
              name: '外卖账号管理系统',
              executableName: '外卖账号管理系统',
              icon: './public/icons/icon.ico',
              asar: true,
              win32metadata: {
                CompanyName: '',
                FileDescription: '外卖账号管理系统',
                OriginalFilename: '外卖账号管理系统.exe',
                ProductName: '外卖账号管理系统',
                InternalName: '外卖账号管理系统'
              }
            },
            makers: [
              {
                name: '@electron-forge/maker-squirrel',
                config: {
                  name: '外卖账号管理系统',
                  setupIcon: './public/icons/icon.ico',
                  iconUrl: 'file://./public/icons/icon.ico'
                }
              },
              {
                name: '@electron-forge/maker-zip',
                platforms: ['win32']
              }
            ]
          };
          "@
          
          # 将配置写入文件
          Set-Content -Path "forge.config.js" -Value $forgeConfig
          
          # 安装electron-forge和相关依赖
          npm install --no-save @electron-forge/cli @electron-forge/maker-squirrel @electron-forge/maker-zip
          
          # 创建构建脚本
          $buildScript = @"
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          
          console.log('开始构建Windows应用...');
          try {
            // 运行electron-forge make
            execSync('npx electron-forge make --platform=win32 --arch=x64', { stdio: 'inherit' });
            console.log('构建完成!');
            
            // 列出输出目录
            if (fs.existsSync('out')) {
              console.log('输出目录内容:');
              const listDir = (dir) => {
                const files = fs.readdirSync(dir);
                files.forEach(file => {
                  const fullPath = path.join(dir, file);
                  const stats = fs.statSync(fullPath);
                  if (stats.isDirectory()) {
                    console.log(\`目录: \${fullPath}\`);
                    listDir(fullPath);
                  } else {
                    console.log(\`文件: \${fullPath} (\${(stats.size / 1024 / 1024).toFixed(2)} MB)\`);
                  }
                });
              };
              listDir('out');
              
              // 确保dist目录存在
              if (!fs.existsSync('dist')) {
                fs.mkdirSync('dist', { recursive: true });
              }
              
              // 复制安装程序到dist目录
              const squirrelDir = path.join('out', 'make', 'squirrel.windows', 'x64');
              if (fs.existsSync(squirrelDir)) {
                const setupFiles = fs.readdirSync(squirrelDir).filter(file => file.endsWith('.exe'));
                if (setupFiles.length > 0) {
                  setupFiles.forEach(file => {
                    const source = path.join(squirrelDir, file);
                    const dest = path.join('dist', file);
                    fs.copyFileSync(source, dest);
                    console.log(\`已复制安装程序: \${dest}\`);
                  });
                }
              }
            }
          } catch (error) {
            console.error('构建失败:', error);
            process.exit(1);
          }
          "@
          
          # 将脚本写入文件
          Set-Content -Path "build-exe.js" -Value $buildScript -Encoding UTF8
          
          # 运行构建脚本
          node build-exe.js
          
      - name: 检查构建结果
        run: |
          echo "检查dist目录"
          if (Test-Path dist) {
            dir dist -Recurse | Select-Object FullName
          } else {
            echo "dist目录不存在"
          }
          
      - name: 上传 Windows 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
          if-no-files-found: warn
            
  release:
    name: 创建发布版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 获取版本号
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          
      - name: 显示结构
        run: ls -R
        working-directory: dist
        
      - name: 创建版本发布
        uses: softprops/action-gh-release@v1
        with:
          name: 外卖账号管理系统 v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 