name: Build Multi-Platform App

on:
  push:
    branches:
      - master
      - main
      - feature/session-management
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
      
    - name: Environment info
      run: |
        node --version
        npm --version
        echo "OS: $env:OS"
        echo "Working directory: $env:GITHUB_WORKSPACE"
        dir
        
    - name: Install dependencies
      run: |
        npm config set registry https://registry.npmmirror.com/
        npm config set electron_mirror https://npmmirror.com/mirrors/electron/
        npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
        npm ci
        
    - name: Install electron-packager
      run: npm install --no-save electron-packager
        
    - name: Create build script
      run: |
        $simpleScript = @'
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        
        console.log('Starting Windows build...');
        
        try {
          // Ensure dist directory exists
          if (!fs.existsSync('dist')) {
            fs.mkdirSync('dist', { recursive: true });
          }
          
          // Use electron-packager for simplicity - without icon parameter
          execSync('npx electron-packager . WaimaiAccountManager --platform=win32 --arch=x64 --out=dist --overwrite --executable-name=WaimaiAccountManager --asar', { 
            stdio: 'inherit',
            env: {
              ...process.env,
              ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
            }
          });
          
          console.log('Build completed successfully!');
          
          // List output files
          if (fs.existsSync('dist')) {
            console.log('Output directory contents:');
            const files = fs.readdirSync('dist');
            console.log(files);
            
            // Find the app directory
            const appDir = files.find(f => fs.statSync(path.join('dist', f)).isDirectory());
            if (appDir) {
              console.log(`App directory: ${appDir}`);
              
              // Create a simple batch file to launch the app
              const batchContent = `@echo off\r\nstart "" "%~dp0${appDir}\\WaimaiAccountManager.exe"\r\n`;
              fs.writeFileSync('dist/Start_WaimaiManager.bat', batchContent);
              
              // Create portable zip
              console.log('Creating portable ZIP package...');
              const zipPath = path.join('dist', 'WaimaiAccountManager-portable-win-x64.zip');
              execSync(`powershell Compress-Archive -Path "${path.join('dist', appDir, '*')}" -DestinationPath "${zipPath}" -Force`, { stdio: 'inherit' });
              console.log(`Created portable package: ${zipPath}`);
            }
          }
        } catch (error) {
          console.error('Build failed:', error);
          process.exit(1);
        }
        '@
        
        Set-Content -Path "simple-build.js" -Value $simpleScript -Encoding UTF8
    
    - name: Run build script
      run: node simple-build.js
    
    - name: Check build results
      run: |
        if (Test-Path dist) {
          dir dist -Recurse | Select-Object FullName
        } else {
          echo "dist directory does not exist"
        }
        
    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: |
          dist/**/WaimaiAccountManager.exe
        if-no-files-found: warn
        
    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: portable-win-x64
        path: |
          dist/WaimaiAccountManager-portable-win-x64.zip
        if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
      
    - name: Environment info
      run: |
        node --version
        npm --version
        echo "OS: $(uname -s)"
        echo "Working directory: $GITHUB_WORKSPACE"
        ls -la
        
    - name: Install dependencies
      run: |
        npm config set registry https://registry.npmmirror.com/
        npm config set electron_mirror https://npmmirror.com/mirrors/electron/
        npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
        npm ci
        
    - name: Install electron-packager
      run: npm install --no-save electron-packager
        
    - name: Create build script
      run: |
        cat > simple-build-mac.js << 'EOL'
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        
        console.log('Starting macOS build...');
        
        try {
          // Ensure dist directory exists
          if (!fs.existsSync('dist')) {
            fs.mkdirSync('dist', { recursive: true });
          }
          
          // Use electron-packager for macOS
          execSync('npx electron-packager . "WaimaiAccountManager" --platform=darwin --arch=x64 --out=dist --overwrite --asar', { 
            stdio: 'inherit',
            env: {
              ...process.env,
              ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
            }
          });
          
          console.log('Build completed successfully!');
          
          // List output files
          if (fs.existsSync('dist')) {
            console.log('Output directory contents:');
            const files = fs.readdirSync('dist');
            console.log(files);
            
            // Find the app directory
            const appDir = files.find(f => f.endsWith('.app') || fs.statSync(path.join('dist', f)).isDirectory());
            if (appDir) {
              console.log(`App directory: ${appDir}`);
              
              // Create portable zip
              console.log('Creating portable ZIP package...');
              const zipPath = path.join('dist', 'WaimaiAccountManager-portable-mac-x64.zip');
              execSync(`cd dist && zip -r "${path.basename(zipPath)}" "${appDir}"`, { stdio: 'inherit' });
              console.log(`Created portable package: ${zipPath}`);
            }
          }
        } catch (error) {
          console.error('Build failed:', error);
          process.exit(1);
        }
        EOL
        
        chmod +x simple-build-mac.js
    
    - name: Run build script
      run: node simple-build-mac.js
    
    - name: Check build results
      run: |
        if [ -d "dist" ]; then
          find dist -type f | sort
        else
          echo "dist directory does not exist"
        fi
        
    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: |
          dist/**/*.app
        if-no-files-found: warn
        
    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: portable-mac-x64
        path: |
          dist/WaimaiAccountManager-portable-mac-x64.zip
        if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          
      - name: List structure
        run: ls -R
        working-directory: dist
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 